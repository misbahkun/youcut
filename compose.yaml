services:
  app:
    image: ghcr.io/misbahkun/youcut:latest
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/youcut.db
      TEMP_DIR: /data/temp
      APP_BASE_URL: https://youcut.my.id
    volumes:
      - ./data:/data
    ports:
      - "5100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
