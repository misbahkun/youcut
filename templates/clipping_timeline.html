{% extends "base.html" %}
{% block title %}Timeline Cut - Youcut{% endblock %}
{% block content %}
<h2>Timeline Cut</h2>

<div id="inputSection">
    <div class="mb-3">
        <label for="youtubeUrl" class="form-label">Link YouTube</label>
        <input type="url" class="form-control" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." required>
    </div>
    <div class="row mb-3">
        <div class="col-md-6">
            <label for="quality" class="form-label">Kualitas</label>
            <select id="quality" class="form-select">
                <option value="720p" selected>720p</option>
                <option value="1080p">1080p</option>
            </select>
        </div>
        <div class="col-md-6">
            <label for="orientation" class="form-label">Orientasi</label>
            <select id="orientation" class="form-select">
                <option value="landscape" selected>16:9 Landscape</option>
                <option value="portrait">9:16 Portrait</option>
            </select>
        </div>
    </div>
    <button class="btn btn-primary" id="createTimelineBtn">Buat Klip</button>
    <div id="progressArea" style="display:none;" class="mt-3">
        <div class="progress">
            <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%">0%</div>
        </div>
        <div id="progressText" class="text-center mt-1 small text-muted"></div>
    </div>
</div>

<div id="timelineSection" style="display:none;">
    <div class="mb-3">
        <video id="mainVideo" controls style="width:100%; max-height:400px;"></video>
    </div>
    <div id="cutsContainer"></div>
    <div class="mt-3 d-flex gap-2 flex-wrap">
        <button class="btn btn-secondary btn-sm" id="addTimelineCutBtn">+ Tambah Potongan</button>
        <button class="btn btn-outline-danger btn-sm" id="resetTimelineBtn">Reset</button>
        <button class="btn btn-success btn-sm" id="downloadAllBtn">Download Semua (.zip)</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<link href="https://cdn.jsdelivr.net/npm/nouislider@15.7.0/dist/nouislider.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.0/dist/nouislider.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const inputSection = document.getElementById('inputSection');
    const timelineSection = document.getElementById('timelineSection');
    const createBtn = document.getElementById('createTimelineBtn');
    const progressArea = document.getElementById('progressArea');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const mainVideo = document.getElementById('mainVideo');
    const cutsContainer = document.getElementById('cutsContainer');
    const addCutBtn = document.getElementById('addTimelineCutBtn');
    const resetBtn = document.getElementById('resetTimelineBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');

    let jobId = null;
    let videoDuration = 0;
    let quality = '720p';
    let orientation = 'landscape';

    function resetAll() {
        inputSection.style.display = 'block';
        timelineSection.style.display = 'none';
        progressArea.style.display = 'none';
        cutsContainer.innerHTML = '';
        mainVideo.src = '';
        jobId = null;
        videoDuration = 0;
    }

    function createCutRow(defaultStart = 0, defaultEnd = null) {
        if (videoDuration === 0) return;
        const row = document.createElement('div');
        row.className = 'cut-item border rounded p-3 mb-3';
        row.innerHTML = `
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="mb-0">Potongan</h6>
                <button class="btn btn-sm btn-danger remove-timeline-cut">Hapus</button>
            </div>
            <div class="row align-items-center">
                <div class="col-md-8">
                    <div class="slider-container mb-2"></div>
                    <div class="d-flex justify-content-between">
                        <small>Mulai: <span class="start-label">0.0</span> detik</small>
                        <small>Selesai: <span class="end-label">0.0</span> detik</small>
                    </div>
                </div>
                <div class="col-md-4 text-center">
                    <button class="btn btn-primary btn-sm preview-btn mb-1">Preview</button>
                    <button class="btn btn-success btn-sm download-btn">Download</button>
                </div>
            </div>
        `;

        const sliderDiv = row.querySelector('.slider-container');
        noUiSlider.create(sliderDiv, {
            start: [defaultStart, defaultEnd || videoDuration],
            connect: true,
            range: { min: 0, max: videoDuration },
            step: 0.1,
            behaviour: 'tap-drag',
            tooltips: false
        });

        const startLabel = row.querySelector('.start-label');
        const endLabel = row.querySelector('.end-label');
        const slider = sliderDiv.noUiSlider;

        slider.on('update', function(values) {
            const s = parseFloat(values[0]).toFixed(1);
            const e = parseFloat(values[1]).toFixed(1);
            startLabel.textContent = s;
            endLabel.textContent = e;
        });

        row.querySelector('.preview-btn').addEventListener('click', function() {
            const start = parseFloat(slider.get()[0]);
            mainVideo.currentTime = start;
            mainVideo.play();
            const end = parseFloat(slider.get()[1]);
            const onTimeUpdate = function() {
                if (mainVideo.currentTime >= end) {
                    mainVideo.pause();
                    mainVideo.removeEventListener('timeupdate', onTimeUpdate);
                }
            };
            mainVideo.addEventListener('timeupdate', onTimeUpdate);
        });

        row.querySelector('.download-btn').addEventListener('click', async function() {
            const start = parseFloat(slider.get()[0]);
            const end = parseFloat(slider.get()[1]);
            if (start >= end) {
                alert('Waktu tidak valid.');
                return;
            }
            const btn = this;
            btn.disabled = true;
            btn.textContent = 'Memproses...';
            try {
                const resp = await fetch('/api/timeline/cut_single', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({job_id: jobId, start, end, quality, orientation})
                });
                if (!resp.ok) {
                    const errData = await resp.json();
                    throw new Error(errData.error || 'Gagal memotong');
                }
                const blob = await resp.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `clip_${start.toFixed(1)}-${end.toFixed(1)}.mp4`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (error) {
                alert('Gagal mengunduh: ' + error.message);
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Download';
            }
        });

        row.querySelector('.remove-timeline-cut').addEventListener('click', function() {
            if (cutsContainer.children.length > 1) {
                row.remove();
            } else {
                alert('Minimal satu potongan.');
            }
        });

        cutsContainer.appendChild(row);
    }

    createBtn.addEventListener('click', async function() {
        const url = document.getElementById('youtubeUrl').value.trim();
        quality = document.getElementById('quality').value;
        orientation = document.getElementById('orientation').value;

        if (!url.includes('youtube.com/watch') && !url.includes('youtu.be/')) {
            alert('URL YouTube tidak valid.');
            return;
        }

        progressArea.style.display = 'block';
        progressBar.style.width = '0%';
        progressBar.textContent = '0%';
        progressText.textContent = 'Memulai unduhan...';
        createBtn.disabled = true;

        try {
            const resp = await fetch('/api/timeline/create_job', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({youtube_url: url, quality, orientation})
            });
            const data = await resp.json();
            if (data.error) {
                progressText.textContent = 'Error: ' + data.error;
                createBtn.disabled = false;
                return;
            }
            jobId = data.job_id;
            const interval = setInterval(async () => {
                const stResp = await fetch(`/api/manual/job_status/${jobId}`);
                const st = await stResp.json();
                progressBar.style.width = st.progress + '%';
                progressBar.textContent = st.progress + '%';
                if (st.status === 'downloading') {
                    progressText.textContent = 'Mengunduh video...';
                } else if (st.status === 'ready') {
                    progressText.textContent = 'Unduhan selesai!';
                    progressBar.style.width = '100%';
                    progressBar.textContent = '100%';
                    clearInterval(interval);
                    createBtn.disabled = false;
                    setTimeout(() => {
                        progressArea.style.display = 'none';
                        inputSection.style.display = 'none';
                        timelineSection.style.display = 'block';
                        mainVideo.src = `/api/timeline/get_video/${jobId}`;
                        mainVideo.onloadedmetadata = function() {
                            videoDuration = mainVideo.duration;
                            cutsContainer.innerHTML = '';
                            createCutRow(0, videoDuration);
                        };
                    }, 500);
                } else if (st.status === 'error') {
                    progressText.textContent = 'Error: ' + st.error;
                    clearInterval(interval);
                    createBtn.disabled = false;
                }
            }, 1000);
        } catch (e) {
            progressText.textContent = 'Gagal menghubungi server.';
            createBtn.disabled = false;
        }
    });

    addCutBtn.addEventListener('click', function() {
        if (!videoDuration) return;
        if (cutsContainer.children.length >= 15) {
            alert('Maksimal 15 potongan.');
            return;
        }
        createCutRow(0, videoDuration);
    });

    resetBtn.addEventListener('click', resetAll);

    // Tombol Download Semua (.zip)
    downloadAllBtn.addEventListener('click', async function() {
        if (!jobId) {
            alert('Tidak ada video yang sedang diproses.');
            return;
        }
        const cuts = [];
        const rows = cutsContainer.querySelectorAll('.cut-item');
        rows.forEach(row => {
            const slider = row.querySelector('.slider-container').noUiSlider;
            if (slider) {
                const values = slider.get();
                cuts.push({ start: parseFloat(values[0]), end: parseFloat(values[1]) });
            }
        });
        if (cuts.length === 0) {
            alert('Tambahkan minimal satu potongan.');
            return;
        }
        downloadAllBtn.disabled = true;
        downloadAllBtn.textContent = 'Menyiapkan...';
        try {
            const resp = await fetch('/api/timeline/download_all_zip', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ job_id: jobId, cuts, quality, orientation })
            });
            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.error || 'Gagal');
            }
            const blob = await resp.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'youcut_clips.zip';
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);
        } catch (err) {
            alert('Gagal mengunduh: ' + err.message);
        } finally {
            downloadAllBtn.disabled = false;
            downloadAllBtn.textContent = 'Download Semua (.zip)';
        }
    });
});
</script>
{% endblock %}
